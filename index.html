<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cards: per-length font instance selection</title>

  <style>
    :root {
      --cardW: 140mm;
      --cardH: 45mm;
      --stroke: 1px solid #000;
    }

    body {
      margin: 16px;
      background: #fff;
      color: #000;
      font-family: system-ui, sans-serif;
    }

    #deck {
      display: block;
    }

    /* Each page is built by JS */
    .page {
      display: block;
      height: 297mm;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: stretch;
      page-break-after: always;
      break-after: page;
    }

    /* Each row is built by JS */
    .row {
      display: flex;
      justify-content: center;
      /* side-to-side cut line */
    }

    /* bottom cut line for last row in each page */
    .page .row:last-child {
      border-bottom: var(--stroke);
    }

    .card.vertical {
      width: 40mm;
      height: 140mm;
      padding: 5mm 5mm;
      box-sizing: border-box;
      border-left: var(--stroke);
      border-top: var(--stroke);
      overflow: hidden;
    }

    .card.horizontal {
      width: var(--cardW);
      height: var(--cardH);
      overflow: hidden;
      border: 0;
      border-left: var(--stroke);
      padding: 1mm 0 0 0;
    }


    /* right outer cut line */
    .row .card:last-child {
      border-right: var(--stroke);
    }

    .card svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .card path {
      fill: #000;
    }

    @media print {
      /*
      @page {
        size: A4 landscape;
        margin: 5mm;
      }
      */

      body {
        margin: 0;
      }

      .card {
        break-inside: avoid;
      }

      .page:last-of-type {
        page-break-after: auto;
        break-after: auto;
      }
    }

    @font-face {
      font-family: "Recursive";
      src:
        url("./fonts/Recursive/Recursive_VF_1.085.ttf") format('truetype');
      font-display: swap;

      /* Declare supported axis ranges if you know them (recommended) */
      font-weight: 100 900;          /* wght */
    }
    @font-face {
      font-family: "Recursive-static";
      src:
        url("./fonts/Recursive/Recursive-static.ttf") format('truetype');
      font-display: swap;

      /* Declare supported axis ranges if you know them (recommended) */
    }

    h1.recursive {
      font-family: "Recursive";
      font-variation-settings: "MONO" 1;
      font-weight: 500;
      font-size: 6vw;
    }
    h1.recursive-static {
      font-family: "Recursive-static";
      font-size: 6vw;
      text-align: center;
      margin: 0;
    }

  </style>

  <script src="https://cdn.jsdelivr.net/npm/opentype.js@1.3.4/dist/opentype.min.js"></script>
  <script src="words.js"></script>
</head>

<body>
  <div id="deck">

  </div>

  <script>
    if (typeof words === "undefined" || !Array.isArray(words)) {
      throw new Error("words.js must define: const words = [ ... ];");
    }

    // ============================================================
    // 1) FREE MAP OF STATIC FONT INSTANCES (key -> path)
    // ============================================================
    const FONT_FILES = {
      
      "default": "recursive-static.ttf",
      // "default": "./fonts/Roboto_Mono/static/RobotoMono-Medium.ttf"
      // "default": "./fonts/Inconsolata/static/Inconsolata_ExtraCondensed-Bold.ttf",
      // "big": "./fonts/Inconsolata/static/Inconsolata-SemiBold.ttf",
      // "default": "./fonts/Red_Hat_Mono/static/RedHatMono-Bold.ttf",

      /*
      "w1": "./fonts/Merriweather/static/Merriweather_24pt_SemiCondensed-Medium.ttf",
      "w2": "./fonts/Merriweather/static/Merriweather_24pt-Regular.ttf",
      "w3": "./fonts/Merriweather/static/Merriweather_24pt-Medium.ttf",
      "w4": "./fonts/Merriweather/static/Merriweather_24pt-Medium.ttf",
      "w7": "./fonts/Merriweather/static/Merriweather_24pt_SemiCondensed-SemiBold.ttf",
      "w10": "./fonts/Merriweather/static/Merriweather_24pt_SemiCondensed-ExtraBold.ttf",
      "big": "./fonts/Merriweather/static/Merriweather_24pt_SemiCondensed-SemiBold.ttf",
      */
    };

    // Load every font in the map up-front.
    // (If this is too heavy later, you can prune the map or lazy-load, but you asked for preload.)
    const fonts = new Map();         // key -> opentype.Font
    const fitters = new Map();       // key -> fitWord function

    async function loadAllFonts() {
      const entries = Object.entries(FONT_FILES);
      for (const [key, url] of entries) {
        const res = await fetch(url);
        if (!res.ok) throw new Error(`Font fetch failed: ${res.status} ${url}`);
        const buf = await res.arrayBuffer();
        const font = opentype.parse(buf);
        fonts.set(key, font);
      }
    }

    function getFont(fontKey) {
      const font = fonts.get(fontKey);
      if (!font) throw new Error(`Missing fontKey in FONT_FILES: ${fontKey}`);
      return font;
    }

    function getFitter(fontKey) {
      let fitter = fitters.get(fontKey);
      if (!fitter) {
        fitter = makeFitter(getFont(fontKey));
        fitters.set(fontKey, fitter);
      }
      return fitter;
    }

    // ============================================================
    // 2) Rendering model: SVG paths, full-width fit, constant-height scale,
    //    x-height baseline centering. (Same as your working approach.)
    // ============================================================
    const VIEW_W = 300;
    const VIEW_H = 100;

    const VB_PAD_X = 6;
    const VB_PAD_Y = 6;

    const FONT_SIZE = 1000;

    // Height reference: defines the “as if has f and p” scale.
    // Keep what worked for you; you can tune it later.
    const HEIGHT_REF = "?g";

    const deck = document.getElementById("deck");

    function svgEl(name) {
      return document.createElementNS("http://www.w3.org/2000/svg", name);
    }
    function clearDeck() {
      while (deck.firstChild) deck.removeChild(deck.firstChild);
    }

    function getXHeightInPathUnits(font) {
      const scale = FONT_SIZE / font.unitsPerEm;
      const os2 = font.tables && font.tables.os2;
      if (os2 && typeof os2.sxHeight === "number" && os2.sxHeight > 0) {
        return os2.sxHeight * scale;
      }
      const gx = font.charToGlyph("x").getPath(0, 0, FONT_SIZE);
      const bb = gx.getBoundingBox();
      const yTop = Math.min(bb.y1, bb.y2);
      return Math.max(1, -yTop);
    }

    function buildWordPathVertical(
      word,
      font,
      {
        rowGapEm = 0.0,        // gap BETWEEN ink boxes (em). 0 => bbox-touching
        alignX = "center",     // "left" | "center" | "right"
        padEm = 0.0,           // set to 0 while debugging spacing
      } = {}
    ) {
      const scale = FONT_SIZE / font.unitsPerEm;
      const gapPx = rowGapEm * FONT_SIZE;

      // Measure a stable column width (advanceWidth is appropriate for monospace)
      let cellW = 1;
      const items = [];

      for (const ch of word) {
        const glyph = font.charToGlyph(ch);
        const gp0 = glyph.getPath(0, 0, FONT_SIZE);
        const bb0 = gp0.getBoundingBox();

        const advPx = (glyph.advanceWidth || font.unitsPerEm) * scale;
        cellW = Math.max(cellW, advPx);

        // ink box at baseline y=0
        const inkTop = Math.min(bb0.y1, bb0.y2);
        const inkBot = Math.max(bb0.y1, bb0.y2);
        const inkLeft = Math.min(bb0.x1, bb0.x2);
        const inkRight = Math.max(bb0.x1, bb0.x2);

        items.push({ glyph, bb0, inkTop, inkBot, inkLeft, inkRight });
      }

      const p = new opentype.Path();

      let cursorY = 0;        // where the next glyph's ink TOP should land (in path units)
      let minX = Infinity;
      let maxX = -Infinity;

      for (let i = 0; i < items.length; i++) {
        const it = items[i];

        // Place glyph so that its inkTop == cursorY
        const baselineY = cursorY - it.inkTop;

        // Horizontal alignment inside the column
        let xShift;
        if (alignX === "left") {
          xShift = -it.inkLeft;
        } else if (alignX === "right") {
          xShift = cellW - it.inkRight;
        } else {
          const inkMidX = (it.inkLeft + it.inkRight) / 2;
          xShift = (cellW / 2) - inkMidX;
        }

        p.extend(it.glyph.getPath(xShift, baselineY, FONT_SIZE));

        // Update overall X extents in placed coordinates
        minX = Math.min(minX, xShift + it.inkLeft);
        maxX = Math.max(maxX, xShift + it.inkRight);

        // Next glyph inkTop = current glyph inkBottom + gap
        const placedInkBottom = baselineY + it.inkBot;
        cursorY = placedInkBottom + gapPx;
      }

      const padPx = padEm * FONT_SIZE;
      const totalH = cursorY - gapPx; // remove last added gap

      return {
        path: p,
        minX: minX - padPx,
        minY: 0 - padPx,
        w: (maxX - minX) + 2 * padPx,
        h: totalH + 2 * padPx,
      };
    }

    function rowGapEm(len, {
      max = 0.1,   // gap for very short words
      min = 0.03,  // asymptotic minimum gap
      k   = 0.30    // decay rate (bigger => drops faster)
    } = {}) {
      if (len <= 1) return 0;                 // no “between-letter” gaps
      return min + (max - min) * Math.exp(-k * (len - 1));
    }

    function buildCardVertical(style) {
      const font = getFont(style.fontKey);
      const len = style.word.length;
      const out = buildWordPathVertical(
        style.word,
        font,
        {
          lineHeight: style.vLineHeight ?? 0.7,
          rowGapEm: style.vRowGapEm ?? rowGapEm(len),
          alignX: style.vAlignX ?? "center",
        }
      );

      // Padding in font units (because path is in FONT_SIZE units)
      const pad = (style.vPadEm ?? 0.08) * FONT_SIZE;

      const card = document.createElement("div");
      card.className = "card vertical";

      const svg = svgEl("svg");

      // KEY: per-word viewBox
      svg.setAttribute("viewBox", `${out.minX} ${out.minY} ${out.w} ${out.h}`);
      // If you want “fill the card” (distort to both dimensions):
      svg.setAttribute("preserveAspectRatio", "none");

      // If you want no distortion (will NOT fill both dims):
      // svg.setAttribute("preserveAspectRatio", "xMidYMid meet");

      const path = svgEl("path");
      path.setAttribute("d", out.path.toPathData(2));

      svg.appendChild(path);
      card.appendChild(svg);
      return card;
    }


    function buildWordPathHorizontal(
      word,
      font,
      letterSpacingEm = 0,
      padLeftEm = 0,
      padRightEm = 0
    ) {
      const scale = FONT_SIZE / font.unitsPerEm;
      const trackingPx = letterSpacingEm * FONT_SIZE;

      const p = new opentype.Path();
      let x = 0;
      let prev = null;

      for (let i = 0; i < word.length; i++) {
        const glyph = font.charToGlyph(word[i]);

        if (prev) {
          x += font.getKerningValue(prev, glyph) * scale;
          x += trackingPx; // tracking here
        }

        p.extend(glyph.getPath(x, 0, FONT_SIZE));

        const adv = (glyph.advanceWidth || font.unitsPerEm) * scale;
        x += adv;
        prev = glyph;
      }

      const padLeftPx = padLeftEm * FONT_SIZE;
      const padRightPx = padRightEm * FONT_SIZE;

      return { path: p, xStart: -padLeftPx, xEnd: x + padRightPx };
    }

    function makeFitter(font) {
      const targetW = VIEW_W - 2 * VB_PAD_X;
      const targetH = VIEW_H - 2 * VB_PAD_Y;

      // constant vertical scale from ref string
      const ref = buildWordPathHorizontal(HEIGHT_REF, font);
      const refBB = ref.path.getBoundingBox();
      const refTop = Math.min(refBB.y1, refBB.y2);
      const refBot = Math.max(refBB.y1, refBB.y2);
      const refH = (refBot - refTop) || 1;

      const sy = targetH / refH;

      // baseline chosen so x-height center sits at card center
      const xHeight = getXHeightInPathUnits(font);
      const baselineY = (VB_PAD_Y + targetH / 2) + sy * (xHeight / 2);

      return function fitWord(out, valign) {
        const { path, xStart, xEnd } = out;
        const bb = path.getBoundingBox();

        let left = xStart, right = xEnd;
        if (bb.x1 < left) left = bb.x1;
        if (bb.x2 > right) right = bb.x2;

        const bw = (right - left) || 1;
        const sx = targetW / bw;

        const midX = (left + right) / 2;
        const tx = (VB_PAD_X + targetW / 2) - midX * sx;

        const top = Math.min(bb.y1, bb.y2);
        const bot = Math.max(bb.y1, bb.y2);
        const midY = (top + bot) / 2;

        const ty = (valign === "bbox")
          ? (VB_PAD_Y + targetH / 2) - midY * sy
          : baselineY;

        return {
          d: path.toPathData(2),
          transform: `translate(${tx.toFixed(3)} ${ty.toFixed(3)}) scale(${sx.toFixed(6)} ${sy.toFixed(6)})`
        };
      };
    }

    function buildBlankCard() {
      const card = document.createElement("div");
      card.className = "card vertical";

      const svg = svgEl("svg");
      svg.setAttribute("viewBox", `0 0 ${VIEW_W} ${VIEW_H}`);
      svg.setAttribute("preserveAspectRatio", "xMidYMid meet");
      card.appendChild(svg);

      return card;
    }

    function buildCard(style) {
      const font = getFont(style.fontKey);
      const fitter = getFitter(style.fontKey);


      const out = buildWordPathHorizontal(
        style.word,
        font,
        style.letterSpacingEm,
        style.padLeftEm,
        style.padRightEm
      );
      const fitted = fitter(out, style.valign);

      const card = document.createElement("div");
      card.className = "card";

      const svg = svgEl("svg");
      svg.setAttribute("viewBox", `0 0 ${VIEW_W} ${VIEW_H}`);
      svg.setAttribute("preserveAspectRatio", "xMidYMid meet");
      const g = svgEl("g");
      g.setAttribute("transform", fitted.transform);

      const path = svgEl("path");
      path.setAttribute("d", fitted.d);

      g.appendChild(path);
      svg.appendChild(g);
      card.appendChild(svg);
      return card;
    }

    // ============================================================
    // 3) ONE SINGLE PLACE TO TUNE: if/else chain
    //    You adjust only this block to test visually.
    // ============================================================
    function getStyle(rawWord) {
      const len = rawWord.length;
      let fontKey = "default";
      let word = rawWord;
      if (false) {

      }
      else if (len >= 8) {
        // fontKey = "big";
      }

      /*
      // Default outputs:
      let fontKey = "w4";
      let letterSpacingEm = 0.00;
      let padLeftEm = 0.1;
      let padRightEm = 0.1;
      let valign = "xheight";

      // ---- ONLY EDIT BELOW THIS LINE ----
      if (false) {

      }
      else if (len <= 1) {
        fontKey = "w1";
        padLeftEm = 1;
        padRightEm = 1;
        valign = "bbox";
      }
      else if (len <= 2) {
        fontKey = "w2";
        letterSpacingEm = 0.05;
        padLeftEm = 0.5;
        padRightEm = 0.5;
        valign = "bbox";
      }
      else if (len <= 3) {
        fontKey = "w3";
        padLeftEm = 0.3;
        padRightEm = 0.3;
        letterSpacingEm = 0.2;
        valign = "bbox";
      }
      else if (len <= 4) {
        fontKey = "w4";
      }
      /* 
      else if (len <= 7) {
        fontKey = "w7";
      } else if (len <= 10) {
        fontKey = "w10";
      }
      else {
        fontKey = "w7";
      }
      */
      // ---- ONLY EDIT ABOVE THIS LINE ----

      return {
        "word": word,
        "fontKey": fontKey,
      };
    }

    // ============================================================
    // 4) Render (preload everything, then build)
    // ============================================================
    async function main() {
      await loadAllFonts();

      clearDeck();

      const CARDS_PER_ROW = 5;
      const ROWS_PER_PAGE = 2;
      const CARDS_PER_PAGE = CARDS_PER_ROW * ROWS_PER_PAGE;

      // always print full pages (blanks added)
      const totalCards = Math.ceil(words.length / CARDS_PER_PAGE) * CARDS_PER_PAGE;

      let pageEl = null;
      let rowEl = null;

      for (let i = 0; i < totalCards; i++) {
        if (i % CARDS_PER_PAGE === 0) {
          pageEl = document.createElement("div");
          pageEl.className = "page";
          deck.appendChild(pageEl);
        }

        if (i % CARDS_PER_ROW === 0) {
          rowEl = document.createElement("div");
          rowEl.className = "row";
          pageEl.appendChild(rowEl);
        }

        const raw = words[i];

        // blanks to complete the 6×3 matrix
        if (typeof raw !== "string") {
          rowEl.appendChild(buildBlankCard());
          continue;
        }

        const style = getStyle(raw);
        rowEl.appendChild(buildCardVertical(style));
      }

    }

    main().catch(console.error);
  </script>
</body>

</html>
